name: Update S&B history

on:
  schedule:
    # 13:00 UTC = 22:00 KST (매일, S&B 모든 지역 마감 후)
    - cron: '0 13 * * *'
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch live S&B data from deployed API
        run: |
          set -e
          curl -sf "https://bunker-dashboard-murex.vercel.app/api/sb-prices" \
            -H "cache-control: no-store" \
            -o new_sb.json
          BYTES=$(wc -c < new_sb.json)
          echo "Fetched $BYTES bytes"
          # sanity check: must contain at least one port
          node -e "const d=require('./new_sb.json'); if(!d.ports||Object.keys(d.ports).length<1){console.error('Empty response'); process.exit(1)}"

      - name: Merge into public/sb-history.json
        run: node scripts/merge-sb-history.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sb-history.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: update S&B history $(date -u +%Y-%m-%d)"
            git push
          fi
